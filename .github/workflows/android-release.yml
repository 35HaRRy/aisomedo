name: android-release

on:
  push:
    tags: ["android-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    concurrency:
      group: android-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a release from master
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing signing input: $name" >&2; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          test -s "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
      - name: Build and check signed release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export ANDROID_RELEASE_VERSION="${RELEASE_TAG#android-v}"
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify signature and checksum
        id: verify
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk aisomedo.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs aisomedo.apk > "$RUNNER_TEMP/apk-signature.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/apk-signature.txt"; then
            echo 'Refusing debug-signed APK' >&2; exit 1
          fi
          sha256sum aisomedo.apk > aisomedo.apk.sha256
      - name: Publish verified APK
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" aisomedo.apk aisomedo.apk.sha256
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Remove temporary signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/android-release.jks" "$RUNNER_TEMP/apk-signature.txt"
