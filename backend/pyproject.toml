[project]
name = "backend"
version = "0.1.0"
description = "FastAPI public application process"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "dojo-core",
]

[project.scripts]
dojo-create-pairing-code = "backend.cli:main"
dojo-consent = "backend.cli:consent_main"
dojo-settings = "backend.cli:settings_main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "httpx>=0.27",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.18,<2",
]

[tool.uv.sources]
dojo-core = { workspace = true }

[tool.uv]
constraint-dependencies = ["mypy==1.18.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
    "backend",
]
