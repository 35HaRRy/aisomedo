[project]
name = "worker"
version = "0.1.0"
description = "Dedicated scheduler/render/publication process"
requires-python = ">=3.12"
dependencies = [
    "dojo-core",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.11",
]

[tool.uv.sources]
dojo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
