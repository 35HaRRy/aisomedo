[project]
name = "dojo-core"
version = "0.1.0"
description = "Deep Dojo Publishing seam and adapters"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "tzdata>=2024.1",
    "pillow>=11",
    "pillow-heif>=0.16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "testcontainers[postgres]>=4.8",
    "docker>=7",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dojo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
