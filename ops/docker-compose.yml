services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dojo
      POSTGRES_USER: dojo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dojo -d dojo"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://dojo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dojo
      MEDIA_ROOT: /media
    volumes:
      - media-data:/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ../worker
    environment:
      DATABASE_URL: postgresql+psycopg://dojo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dojo
      MEDIA_ROOT: /media
      WORKER_INTERVAL_SECONDS: "10"
    volumes:
      - media-data:/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  media-data:
