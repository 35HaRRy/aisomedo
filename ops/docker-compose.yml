x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dojo
      POSTGRES_USER: dojo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dojo -d dojo"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"
      
  init:
    image: dojo-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dojo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-dojo}
    command: [".venv/bin/python", "-m", "dojo.schema"]
    depends_on:
      db:
        condition: service_healthy
    logging: *bounded-logs
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://dojo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dojo
      MEDIA_ROOT: /media
      WORKER_HEALTH_PATH: ${WORKER_HEALTH_PATH:-/run/dojo-worker/health.json}
    volumes:
      - media-data:/media
      - worker-health:/run/dojo-worker:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://dojo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dojo
      MEDIA_ROOT: /media
      WORKER_INTERVAL_SECONDS: "10"
      WORKER_HEALTH_PATH: ${WORKER_HEALTH_PATH:-/run/dojo-worker/health.json}
    volumes:
      - media-data:/media
      - worker-health:/run/dojo-worker
    depends_on:
      db:
        condition: service_healthy

volumes:
  worker-health:
  db-data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './db-data'
  media-data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './media-data'
